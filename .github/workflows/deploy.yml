name: Desplegar

# Se lanza a mano desde la pestaña Actions -> "Desplegar" -> Run workflow.
# Para hacer ROLLBACK basta con volver a ejecutarlo indicando el tag (sha) de una version anterior.
on:
  workflow_dispatch:
    inputs:
      entorno:
        description: Entorno de destino
        type: choice
        options: [dev, prod]
        default: dev
      backend_tag:
        description: Tag de la imagen del backend (sha completo o latest)
        default: latest
      frontend_tag:
        description: Tag de la imagen del frontend (sha completo o latest)
        default: latest

permissions:
  contents: read
  packages: read

concurrency:
  group: despliegue-${{ inputs.entorno }}
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    # El entorno aporta sus propios secretos y, en prod, la aprobacion manual
    environment: ${{ inputs.entorno }}
    steps:
      - uses: actions/checkout@v4

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar variables
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          {
            echo "BACKEND_IMAGE=ghcr.io/${owner}/empresa-backend:${{ inputs.backend_tag }}"
            echo "FRONTEND_IMAGE=ghcr.io/${owner}/empresa-frontend:${{ inputs.frontend_tag }}"
            echo "APP_USER=APP_USER"
          } >> "$GITHUB_ENV"

      - name: Levantar la pila
        env:
          ORACLE_PASSWORD: ${{ secrets.ORACLE_PASSWORD }}
          APP_USER_PASSWORD: ${{ secrets.APP_USER_PASSWORD }}
        run: docker compose -f docker-compose.deploy.yml up -d --wait --wait-timeout 300

      - name: Prueba de humo
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8081/api/tareas >/dev/null && break
            sleep 5
          done
          curl -sf http://localhost:8081/api/tareas
          echo
          curl -sf -o /dev/null -w "Frontend: %{http_code}\n" http://localhost:8081/

      - name: Logs si falla
        if: failure()
        env:
          ORACLE_PASSWORD: x
          APP_USER_PASSWORD: x
        run: docker compose -f docker-compose.deploy.yml logs --tail 80

      # TODO (servidor real): sustituir "Levantar la pila" por un despliegue por SSH,
      # p. ej. `docker compose pull && docker compose up -d` en el servidor del entorno.
      - name: Resumen
        run: |
          {
            echo "### Despliegue en \`${{ inputs.entorno }}\`"
            echo "- backend: \`${BACKEND_IMAGE}\`"
            echo "- frontend: \`${FRONTEND_IMAGE}\`"
          } >> "$GITHUB_STEP_SUMMARY"
